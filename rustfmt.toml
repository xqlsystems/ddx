# Settings from the Google Rust style guide
# (https://google.github.io/styleguide/rustguide.html#use-the-appropriate-formatting-tool).
# All three need a nightly rustfmt: CI checks with one, and the Nix shell
# provides one. `max_width = 100` is rustfmt's default.

# One `use` per module: no `::` inside braces.
imports_granularity = "Module"
hex_literal_case = "Lower"
format_macro_matchers = true
