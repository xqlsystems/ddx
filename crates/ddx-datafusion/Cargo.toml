[package]
name = "ddx-datafusion"
description = "DataFusion adapter for ddx: grad, vjp and jvp of a whole query, and grad(loss, table.column) in SQL."
# Versioned independently of ddx-core: the two publish on their own cadence, and
# an adapter that had to move whenever the engine did would force a release for
# changes that do not touch it.
version = "0.4.2"
readme = "README.md"
keywords = ["sql", "autograd", "differentiation", "datafusion", "dataframe"]
categories = ["mathematics", "database"]
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

# `ddx-ad` and `datafusion-substrait` carry the work: DataFusion produces the forward
# query's Substrait plan, ddx-ad differentiates it, and DataFusion consumes the
# steps it returns. tests/substrait_pin.rs checks they share one `substrait`.
[dependencies]
ddx-ad = { workspace = true }
datafusion = { workspace = true }
datafusion-substrait = { workspace = true }
# SubstraitConsumer is an async trait (see ad::ShortNames).
async-trait = "0.1"
# ad::run runs a program's checks at once, a task each, and ad::Prepared
# runs one at a time. Already in the tree through datafusion.
tokio = { version = "1", features = ["rt", "sync"] }
# A kept check stops reading at its first row. Already in the tree through
# datafusion.
futures = "0.3"

[features]
# Step-level access to a program's run (`ddx_datafusion::engine`), for ddx's
# own tests and benchmarks. Not part of the API.
internals = []

[dev-dependencies]
# The tests reach the step-level engine (`ddx_datafusion::engine`).
ddx-datafusion = { path = ".", features = ["internals"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# The shared simulation harness (`ddx_core::test_utils`). Deliberately the SAME
# generator and reference interpreter ddx-core fuzzes against: a cross-crate
# agreement test proves nothing if each side invents its own idea of "a random
# derivable expression".
ddx-core = { workspace = true, features = ["test-utils"] }
prost = { workspace = true }
# The tests read ddx-ad's internals (the forward analysis, the plan builder).
ddx-ad = { workspace = true, features = ["internals"] }
