[package]
name = "ddx-ad"
description = "Query-level AD for ddx: grad, vjp and jvp of Substrait plans."
# Versioned independently, like ddx-core. First published when
# ddx-datafusion started depending on it.
version = "0.3.0"
readme = "README.md"
keywords = ["sql", "autograd", "differentiation", "substrait", "backpropagation"]
categories = ["mathematics", "database"]
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

# ddx-ad differentiates Substrait plans, and gets each expression's partial
# derivatives from ddx-core. No engine crate: an adapter produces
# the plan and runs what comes back. Building `substrait` needs `protoc`.
[dependencies]
ddx-core = { workspace = true }
prost = { workspace = true }
substrait = { workspace = true }

[features]
# The plan-reading and plan-writing modules (`forward`, `emit`, `expr`,
# `relation`), public for this workspace's tests only; not a stable API.
internals = []
