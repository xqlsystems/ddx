[package]
name = "ddx-ad"
description = "Query-level AD for ddx: grad, vjp and jvp of Substrait plans."
# Versioned independently, like ddx-core. First published when
# ddx-datafusion started depending on it.
version = "0.2.3"
readme = "README.md"
keywords = ["sql", "autograd", "differentiation", "substrait", "backpropagation"]
categories = ["mathematics", "database"]
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

# ddx-ad differentiates Substrait plans, and gets each expression's partial
# derivatives from ddx-core. No engine crate: an adapter produces
# the plan and runs what comes back. Building `substrait` needs `protoc`.
[dependencies]
ddx-core = { workspace = true }
prost = { workspace = true }
substrait = { workspace = true }
# `to_sql`'s SQL generators, behind `to-sql`: it adds most of a minute to a
# build. Pinned exactly, being 0.x, and never in the public API.
polyglot-sql = { version = "=0.13.3", default-features = false, features = ["generate", "stacker", "dialect-duckdb", "dialect-datafusion"], optional = true }

[features]
# The plan-reading and plan-writing modules (`forward`, `emit`, `expr`,
# `relation`), public for this workspace's tests only; not a stable API.
internals = []
# `to_sql`, which writes a plan as SQL for engines whose Substrait consumer
# cannot run ddx's programs (DuckDB's).
to-sql = ["dep:polyglot-sql"]

[package.metadata.docs.rs]
# Document `to_sql`, which is behind a feature.
features = ["to-sql"]
