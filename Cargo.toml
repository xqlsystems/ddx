# ddx — portable autograd for composable databases.
#
# Query-level AD over Substrait (`ddx-ad`), the scalar derivative rules it
# uses for each expression (`ddx-core`), and thin per-engine adapters. The
# heavy per-engine dependencies (datafusion, duckdb) are quarantined in the
# adapter crates, so the cores can be driven from any engine.
[workspace]
resolver = "2"
members = [
    "crates/ddx-core",
    "crates/ddx-ad",
    "crates/ddx-datafusion",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/xqlsystems/ddx"
authors = ["Alexander Merose <al@merose.com>"]
# MSRV. Enforced by the CI `msrv` matrix entry. The floor is set by a
# transitive build-dependency (ar_archive_writer, which uses edition 2024);
# ddx-core's own code needs far less, but the resolved tree does not build below
# this. Bump only with a matching CI change.
rust-version = "1.88"

[workspace.dependencies]
# ddx-core's expression type and ddx-ad's SQL parser. Pinned exactly, since
# ddx-core's API takes and returns its types: a bump is a breaking release of
# ddx-core. Kept at the version DataFusion uses, so the build
# compiles one `sqlparser`.
sqlparser = { version = "=0.62.0", features = ["visitor"] }

# The DataFusion adapter's engine dependency, quarantined to
# `ddx-datafusion` — neither core crate may depend on it.
#
# Pinned exactly, always, as `sqlparser` and `substrait` are: `ddx-datafusion`'s
# public API takes and returns DataFusion's own types (`SessionContext`,
# `LogicalPlan`, `DataFrame`), so a caller has to link the `datafusion` ddx was
# built against. A bump is a deliberate change: update this line,
# `datafusion-substrait` below, and the Python pins (`python/ddxdb/pyproject.toml`,
# `tests/pyproject.toml`, and their lockfiles); see CONTRIBUTING.md.
datafusion = { version = "=54.1.0" }

# The plan type ddx-ad differentiates. Pinned exactly, for the same reason as
# `sqlparser`: `ddx-ad`'s public API takes and returns `substrait::proto` types,
# and an adapter hands it the plan its engine produced. `datafusion-substrait`
# 54.1 depends on `substrait` 0.63, so that is the version here; if the two
# diverged, `substrait::proto::Plan` would be two unrelated Rust types and the
# adapter would stop compiling.
substrait = { version = "=0.63.0" }
# DataFusion's Substrait producer and consumer, for the adapter. Pinned
# exactly, to the same release as `datafusion`; its `substrait` requirement is
# what the pin above follows.
datafusion-substrait = { version = "=54.1.0" }
# The protobuf runtime `substrait`'s types are generated for. ddx-ad encodes
# plans as bytes for hosts that hold them so, and relations to compare them;
# the version is whatever `substrait` uses.
prost = { version = "0.14" }

# Internal crates, referenced by path within the workspace.
#
# `ddx-core` carries a `version` as well as a `path`: cargo uses the path for
# workspace builds and the version for what it writes into a published
# dependent's manifest, and it refuses to publish a crate whose path dependency
# has no version. The floor is 0.2.1 rather than 0.2 because `grad(abs(u), x)`
# returned a zero gradient for a NULL row in 0.2.0, and an adapter that resolved
# to it would hand users that bug.
ddx-core = { path = "crates/ddx-core", version = "0.3.0" }
ddx-ad = { path = "crates/ddx-ad", version = "0.2.0" }
