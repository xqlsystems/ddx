# Standard PR checks for ddx: formatting, lints, and the deterministic test
# suite. The property/fuzz suite (crates/ddx-core/tests/simulation.rs) is
# intentionally NOT run here — it is a separate, on-demand / soak concern (see
# its module docs) rather than a blocking PR gate — so these checks stay fast
# and deterministic.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. a new push to a PR branch).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI only reads the repo — deny every write scope by default (least privilege).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: rustfmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: rustfmt (check only)
        run: cargo fmt --all --check
      - name: clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: docs (warnings are errors — keeps docs.rs clean)
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: tests (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      # Don't cancel the other toolchains when one fails — a beta/nightly break
      # shouldn't hide a stable/MSRV result.
      fail-fast: false
      matrix:
        # More than stable: beta and nightly catch upcoming-compiler breakage,
        # and "1.88" is the MSRV (must match `rust-version` in Cargo.toml).
        rust: [stable, beta, nightly, "1.88"]
    # Nightly is informational: a nightly regression is usually a toolchain bug,
    # not ours, so it must not block a PR. stable, beta, and MSRV are required.
    continue-on-error: ${{ matrix.rust == 'nightly' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # Everything, discovered rather than enumerated.
      #
      # This used to be a hand-maintained allowlist of `--test` targets, which
      # meant a new tests/*.rs file was a silent no-op in CI until somebody
      # remembered to edit this workflow. It had already gone stale: the list
      # skipped crates/ddx-core/tests/simulation.rs entirely, so its thirteen
      # bounded property tests were not running on any PR — only the long-running
      # soak in that file was meant to be excluded, and that one already carries
      # `#[ignore]`, so plain `cargo test` skips it on its own.
      #
      # `--no-fail-fast` so one red suite doesn't hide the state of the others.
      # The nightly soak job runs the ignored tests explicitly.
      - name: tests
        run: cargo test --workspace --no-fail-fast
      - name: doctests
        run: cargo test --workspace --doc

  # The Python wheel is its own Cargo workspace (pyo3 links libpython, which the
  # Rust jobs above have no reason to need), so it gets its own job rather than
  # riding along with `cargo test --workspace`.
  wheel:
    name: ddxdb wheel (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # 3.10 is the floor `requires-python` claims — tested rather than
      # asserted, the same way the Rust jobs test the MSRV. 3.12 is the version
      # normal development targets.
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: python/ddxdb
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - name: build and test the wheel
        working-directory: python/ddxdb
        run: |
          uv venv --python ${{ matrix.python }}
          uv pip install maturin '.[test]'
          uv run maturin develop --uv
          uv run pytest tests/ -q

  package:
    name: package (publish dry-run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # Catch packaging/metadata breakage (missing files, bad metadata, a
      # path-dep without a version) on every PR — long before a release actually
      # tries to publish. Add publishable crates here as they come online.
      - name: cargo publish --dry-run (ddx-core)
        run: cargo publish --dry-run -p ddx-core
