# Standard PR checks for ddx: formatting, lints, and the deterministic test
# suite. The property/fuzz suite (crates/ddx-core/tests/simulation.rs) is
# intentionally NOT run here — it is a separate, on-demand / soak concern (see
# its module docs) rather than a blocking PR gate — so these checks stay fast
# and deterministic.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. a new push to a PR branch).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI only reads the repo — deny every write scope by default (least privilege).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: rustfmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: rustfmt (check only)
        run: cargo fmt --all --check
      - name: clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: docs (warnings are errors — keeps docs.rs clean)
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: tests (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      # Don't cancel the other toolchains when one fails — a beta/nightly break
      # shouldn't hide a stable/MSRV result.
      fail-fast: false
      matrix:
        # More than stable: beta and nightly catch upcoming-compiler breakage,
        # and "1.88" is the MSRV (must match `rust-version` in Cargo.toml).
        rust: [stable, beta, nightly, "1.88"]
    # Nightly is informational: a nightly regression is usually a toolchain bug,
    # not ours, so it must not block a PR. stable, beta, and MSRV are required.
    continue-on-error: ${{ matrix.rust == 'nightly' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # Everything except tests/simulation.rs (the property/fuzz suite). Split
      # per target so a failure names the suite that broke.
      - name: unit tests
        run: cargo test --workspace --lib --bins
      - name: integration tests (ddx-core)
        run: cargo test -p ddx-core --test rules --test rewrite --test roundtrip
      # The M2 adapter: both rewrite paths end-to-end on a live DataFusion
      # engine, plus the sqlparser single-version guard that keeps Path B's
      # bridge compiling (design.md §6, G2).
      - name: integration tests (ddx-datafusion)
        run: cargo test -p ddx-datafusion --test path_a --test path_b --test sqlparser_pin
      - name: doctests
        run: cargo test --workspace --doc

  package:
    name: package (publish dry-run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # Catch packaging/metadata breakage (missing files, bad metadata, a
      # path-dep without a version) on every PR — long before a release actually
      # tries to publish. Add publishable crates here as they come online.
      - name: cargo publish --dry-run (ddx-core)
        run: cargo publish --dry-run -p ddx-core
