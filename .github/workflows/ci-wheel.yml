# Cross-platform build check for the `ddxdb` wheel.
#
# Separate from `ci.yml` because it answers a different question. `ci.yml`'s
# `wheel` job asks "does it work?" — it builds on Linux and runs the tests, on
# the floor interpreter and the current one. This asks "does it *build* on the
# platforms we ship to?", which is where a `pyo3`/linker problem shows up, and
# which no amount of Linux testing catches.
#
# Build only, no tests: the behaviour is platform-independent (the binding
# passes strings across and nothing else), so running the suite four more times
# would buy nothing for the runtime.
name: ci-wheel

on:
  pull_request:
    paths:
      - 'python/ddxdb/**'
      - 'crates/ddx-core/**'
      - '.github/workflows/ci-wheel.yml'
  push:
    branches: [main]
    paths:
      - 'python/ddxdb/**'
      - 'crates/ddx-core/**'
      - '.github/workflows/ci-wheel.yml'
  workflow_dispatch:

concurrency:
  group: ci-wheel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.platform.runner }} / ${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64
          - runner: macos-latest
            target: aarch64
          - runner: macos-15-intel
            target: x86_64
          - runner: windows-latest
            target: x64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # `toolchain:` is required because the action is SHA-pinned. This action
      # reads the toolchain from its *ref* — `@stable` literally means "install
      # stable" — so pinning to a commit removes that input and the run dies in
      # its "parse toolchain version" step. The ref here is a version pin *and*
      # an argument; only one of those survives pinning.
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      - name: Configure sccache
        shell: bash
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      # 3.10 is the floor `requires-python` claims. Because the crate is abi3
      # (see python/ddxdb/Cargo.toml), building against the floor produces the
      # single wheel that serves every later interpreter — so this is both the
      # strictest build and the one we actually ship.
      - name: Build the wheel
        working-directory: python/ddxdb
        shell: bash
        run: |
          uv venv --python 3.10
          uv pip install maturin
          uv run maturin build --out dist
          ls -l dist
