# Automated crate releases via release-plz (https://release-plz.dev).
#
# On every push to `main`, two things happen:
#   * `release-plz-pr` opens/updates a "Release PR" that bumps the changed
#     crates' versions (SemVer) and updates their CHANGELOG from the git history.
#     Merge it when you want to cut a release — "release often" is just merging
#     this PR often.
#   * `release-plz-release` looks for versions in the repo that aren't on
#     crates.io yet and publishes them (with a matching git tag + GitHub
#     release). So merging the Release PR is what triggers the actual publish.
#
# ONE-TIME SETUP (until this runs, the workflow is a harmless no-op):
#   Add a repository secret `CARGO_REGISTRY_TOKEN` — a crates.io API token
#   (https://crates.io/settings/tokens) scoped to publish-new + publish-update.
#
#   Upgrade path: once the crates exist on crates.io, you can drop the token and
#   switch to crates.io Trusted Publishing (OIDC, no long-lived secret): add
#   `id-token: write` to `permissions` and a `rust-lang/crates-io-auth-action@v1`
#   step before release-plz that exports `CARGO_REGISTRY_TOKEN`.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  # Publish any crate whose version isn't on crates.io yet (runs after a Release
  # PR merges, and on any direct version bump to main).
  release-plz-release:
    name: release-plz release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: release-plz release
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Open/update the Release PR (version bumps + changelog).
  release-plz-pr:
    name: release-plz PR
    runs-on: ubuntu-latest
    # Only one Release PR job at a time, and never cancel a run mid-flight.
    concurrency:
      group: release-plz-pr
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: release-plz release-pr
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
